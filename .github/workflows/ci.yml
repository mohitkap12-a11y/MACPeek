name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit + integration tests
        run: swift test
      - name: Lint (swift-format, if available)
        run: |
          if xcrun --find swift-format >/dev/null 2>&1; then
            xcrun swift-format lint --recursive Sources Tests --strict || true
          else
            echo "swift-format not installed; skipping"
          fi

  core-linux:
    # Core logic is platform-independent; this keeps it honest and fast.
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
