name: CI
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let main-branch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Unit + integration tests
        run: swift test
      - name: Lint (swift-format, if available)
        run: |
          if xcrun --find swift-format >/dev/null 2>&1; then
            xcrun swift-format lint --recursive Sources Tests --strict || true
          else
            echo "swift-format not installed; skipping"
          fi

  core-linux:
    # Core logic is platform-independent; this keeps it honest and fast.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:5.9
    steps:
      - uses: actions/checkout@v7
      - run: swift test
