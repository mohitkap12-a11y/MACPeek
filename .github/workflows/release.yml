name: Release
on:
  push:
    tags: ["v*"]

# Required repository secrets (never commit these):
#   DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD, DEVELOPER_ID_IDENTITY
#   NOTARY_API_KEY_P8_BASE64, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID
# Also required for stable (non-hyphenated) tags: VERCEL_DEPLOY_HOOK_URL (a historical name: it now holds the Cloudflare
# Workers Builds Deploy Hook URL), which rebuilds the website so it shows the new
# version (see docs/release.md). Missing it fails the release before anything is built or published.
# Sparkle in-app updates: repository secret SPARKLE_ED_PRIVATE_KEY (signs the update) and repository VARIABLE
# SPARKLE_PUBLIC_ED_KEY (the matching public key baked into the app). See docs/release.md, "Sparkle setup".
#
# Tags (docs/release.md):
#   v0.4.0         stable: GitHub release ("latest", so releases/latest/download/appcast.xml offers it to everyone),
#                  website rebuild, and its item also replaces the preview feed so opted-in Macs move on to it.
#   v0.4.0-beta.1  preview: GitHub pre-release, and appcast-beta.xml is replaced on the fixed `preview-feed` pre-release.
#                  Only Macs opted in with `defaults write app.macpeek.MacPeek receivePreviewBuilds -bool YES` read it.
#   v0.4.0-rc1     dry run (any other hyphenated tag): GitHub pre-release only; no feed is touched, no website rebuild.
permissions:
  contents: write


jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # CHANNEL: stable -> appcast.xml (everyone); beta -> appcast-beta.xml (opted-in Macs); dryrun -> no feed.
          # Sparkle orders 0.4.0-beta.1 < 0.4.0-beta.2 < 0.4.0 (build numbers 0.4.0b1 < 0.4.0b2 < 0.4.0, see build-app.sh).
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then CHANNEL=stable
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then CHANNEL=beta
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then CHANNEL=dryrun
          else echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z, vX.Y.Z-beta.N or a hyphenated dry run (docs/release.md)."; exit 1; fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "Channel: $CHANNEL"

      - name: Check the preview feed address matches the app
        run: |
          PREVIEW="$(/usr/libexec/PlistBuddy -c 'Print :MacPeekPreviewFeedURL' Resources/Info.plist)"
          WANT="https://github.com/${GITHUB_REPOSITORY}/releases/download/preview-feed/appcast-beta.xml"
          test "$PREVIEW" = "$WANT" || { echo "::error::MacPeekPreviewFeedURL in Resources/Info.plist ($PREVIEW) is not $WANT. Change them together."; exit 1; }

      - name: Require website deploy hook for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "::error::VERCEL_DEPLOY_HOOK_URL is not set. Without it the website cannot learn about this release. Create a Deploy Hook on the macpeek-web Worker in Cloudflare (Settings > Builds > Deploy Hooks, branch main) and save its URL as that secret."; exit 1; }

      - name: Require release notes for stable releases
        # The update window shows docs/release-notes/<tag>.md, so a stable release cannot ship without it.
        if: ${{ env.CHANNEL == 'stable' }}
        run: |
          F="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -s "$F" || { echo "::error::$F is missing or empty. Sparkle's update window shows it as the release notes (docs/release.md)."; exit 1; }
          ! grep -q ']]>' "$F" || { echo "::error::$F contains ']]>', which would end the appcast's CDATA block early."; exit 1; }

      - name: Require Sparkle keys
        env:
          SPARKLE_PRIVATE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE" || { echo "::error::Secret SPARKLE_ED_PRIVATE_KEY is not set (see docs/release.md, Sparkle setup)."; exit 1; }
          test -n "$SPARKLE_PUBLIC" || { echo "::error::Repository variable SPARKLE_PUBLIC_ED_KEY is not set (see docs/release.md, Sparkle setup)."; exit 1; }

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign app (Developer ID, hardened runtime)
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SIGN_IDENTITY" || { echo "DEVELOPER_ID_IDENTITY missing — refusing to publish unsigned build"; exit 1; }
          scripts/build-app.sh "$VERSION"

      - name: Create DMG
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: scripts/make-dmg.sh "$VERSION"

      - name: Notarize and staple (fails the release if rejected)
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "dist/MacPeek-${VERSION}.dmg" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "dist/MacPeek-${VERSION}.dmg"
          xcrun stapler validate "dist/MacPeek-${VERSION}.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/MacPeek-${VERSION}.dmg"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Sign update and write the feed (Sparkle)
        # Sign the final, stapled DMG, then describe it in the update feed the app reads
        # (releases/latest/download/appcast.xml always resolves to the newest stable release's feed).
        env:
          SPARKLE_PRIVATE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # sign_update ships inside the Sparkle package SwiftPM already downloaded and checksum-verified for the build
          # (the version pinned in Package.swift), so no separate, unverified download runs with the private key.
          SIGN_UPDATE="$(find .build/artifacts -type f -name sign_update | head -1)"
          test -x "$SIGN_UPDATE" || { echo "::error::sign_update not found in the SwiftPM Sparkle artifact"; exit 1; }
          DMG="dist/MacPeek-${VERSION}.dmg"
          SIG="$(printf '%s' "$SPARKLE_PRIVATE" | "$SIGN_UPDATE" --ed-key-file - -p "$DMG")"
          test -n "$SIG" || { echo "::error::sign_update produced no signature"; exit 1; }
          LENGTH="$(stat -f%z "$DMG")"
          # What Sparkle compares: the built app's CFBundleVersion (hyphen-free, 0.4.0-beta.1 -> 0.4.0b1; see build-app.sh).
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/MacPeek.app/Contents/Info.plist")"
          [[ -n "$BUILD" && "$BUILD" != *-* ]] || { echo "::error::CFBundleVersion '$BUILD' is empty or has a hyphen; Sparkle would ignore what follows it."; exit 1; }
          TITLE="MacPeek"; [ "$CHANNEL" = beta ] && TITLE="MacPeek (preview)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/MacPeek-${VERSION}.dmg"
          FULL_NOTES="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          # Release notes shown inside Sparkle's update window: the tag's own file, or for -beta.N / dry-run tags the
          # file of the version they lead to. Embedded as markdown (no web page, works offline); the leading "# MacPeek X"
          # heading is dropped because the window already names the version. No file (a beta before notes exist): no notes.
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES_FILE" ] || NOTES_FILE="docs/release-notes/v${VERSION%%-*}.md"
          DESCRIPTION=""
          if [ -s "$NOTES_FILE" ]; then
            ! grep -q ']]>' "$NOTES_FILE" || { echo "::error::$NOTES_FILE contains ']]>', which would end the CDATA block early."; exit 1; }
            DESCRIPTION="<description sparkle:format=\"markdown\"><![CDATA[$(sed '1{/^# /d;}' "$NOTES_FILE")]]></description>"
            echo "Release notes: $NOTES_FILE"
          else
            echo "::warning::No release notes file for $GITHUB_REF_NAME; the update window will show none."
          fi
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>${TITLE}</title>
              <item>
                <title>MacPeek ${VERSION}</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                ${DESCRIPTION}
                <sparkle:fullReleaseNotesLink>${FULL_NOTES}</sparkle:fullReleaseNotesLink>
                <enclosure url="${URL}" length="${LENGTH}" type="application/octet-stream" sparkle:edSignature="${SIG}"/>
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout dist/appcast.xml
          cat dist/appcast.xml
          # The preview feed has the same item: a beta publishes it as appcast-beta.xml; a stable release does too, so
          # opted-in Macs move on to it. (A dry run publishes neither: its appcast.xml sits on a pre-release, never "latest".)
          sed "s#<title>MacPeek</title>#<title>MacPeek (preview)</title>#" dist/appcast.xml > dist/appcast-beta.xml
          xmllint --noout dist/appcast-beta.xml

      - name: Add versionless DMG and checksums
        # The website's Download button links to releases/latest/download/MacPeek.dmg, a name that never changes,
        # so it always serves the newest release without editing the site.
        run: |
          set -euo pipefail
          cd dist
          cp "MacPeek-${VERSION}.dmg" MacPeek.dmg
          shasum -a 256 "MacPeek-${VERSION}.dmg" MacPeek.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/MacPeek-${{ env.VERSION }}.dmg
            dist/MacPeek.dmg
            dist/SHA256SUMS
            dist/appcast.xml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish the preview feed (appcast-beta.xml on the preview-feed pre-release)
        # A fixed pre-release (tag `preview-feed`, never "latest", never matches v* so it starts no workflow) whose one
        # asset is replaced each time: MacPeekPreviewFeedURL in Info.plist points at it. Created on first use. It runs
        # after the versioned release is public, so the feed never points at a DMG that is not there yet.
        if: ${{ env.CHANNEL != 'dryrun' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview-feed
          target_commitish: ${{ github.sha }}
          name: Preview feed (do not delete)
          body: Holds appcast-beta.xml, the update feed for Macs opted in to MacPeek preview builds. Replaced by every stable and -beta.N release. See docs/release.md, "Preview builds".
          prerelease: true
          make_latest: false
          files: dist/appcast-beta.xml
          overwrite_files: true

      - name: Rebuild website (shows the new version)
        # Releases created with GITHUB_TOKEN do not trigger other workflows, so the hook is called here. The release is
        # already public at this point, so a failed call warns (with the manual fix) instead of failing the job.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if curl -fsS --connect-timeout 10 --max-time 60 -X POST "$HOOK" >/dev/null; then
            echo "Website rebuild triggered"
          else
            echo "::warning::Release published, but the website rebuild call failed. Trigger a rebuild of the macpeek-web Worker in Cloudflare (Settings > Builds, or POST the deploy hook) so the site shows v${VERSION}."
          fi
