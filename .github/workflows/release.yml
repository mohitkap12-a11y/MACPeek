name: Release
on:
  push:
    tags: ["v*"]

# Required repository secrets (never commit these):
#   DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD, DEVELOPER_ID_IDENTITY
#   NOTARY_API_KEY_P8_BASE64, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID
# Optional: VERCEL_DEPLOY_HOOK_URL rebuilds the website so it shows the new version (see docs/release.md).
# Tags containing a hyphen (v0.1.0-rc1) are published as pre-releases: never "latest", no website rebuild.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign app (Developer ID, hardened runtime)
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          test -n "$SIGN_IDENTITY" || { echo "DEVELOPER_ID_IDENTITY missing — refusing to publish unsigned build"; exit 1; }
          scripts/build-app.sh "$VERSION"

      - name: Create DMG
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: scripts/make-dmg.sh "$VERSION"

      - name: Notarize and staple (fails the release if rejected)
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "dist/MacPeek-${VERSION}.dmg" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "dist/MacPeek-${VERSION}.dmg"
          xcrun stapler validate "dist/MacPeek-${VERSION}.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/MacPeek-${VERSION}.dmg"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Add versionless DMG and checksums
        # The website's Download button links to releases/latest/download/MacPeek.dmg, a name that never changes,
        # so it always serves the newest release without editing the site.
        run: |
          set -euo pipefail
          cd dist
          cp "MacPeek-${VERSION}.dmg" MacPeek.dmg
          shasum -a 256 "MacPeek-${VERSION}.dmg" MacPeek.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacPeek-${{ env.VERSION }}.dmg
            dist/MacPeek.dmg
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Rebuild website (shows the new version)
        # Releases created with GITHUB_TOKEN do not trigger other workflows, so the hook is called here.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "Website rebuild triggered"
          else echo "VERCEL_DEPLOY_HOOK_URL not set; the website keeps showing the previous version label"; fi
