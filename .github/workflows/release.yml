name: Release
on:
  push:
    tags: ["v*"]

# Required repository secrets (never commit these):
#   DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD, DEVELOPER_ID_IDENTITY
#   NOTARY_API_KEY_P8_BASE64, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID
# Also required for stable (non-hyphenated) tags: VERCEL_DEPLOY_HOOK_URL (a historical name: it now holds the Cloudflare
# Workers Builds Deploy Hook URL), which rebuilds the website so it shows the new
# version (see docs/release.md). Missing it fails the release before anything is built or published.
# Sparkle in-app updates: repository secret SPARKLE_ED_PRIVATE_KEY (signs the update) and repository VARIABLE
# SPARKLE_PUBLIC_ED_KEY (the matching public key baked into the app). See docs/release.md, "Sparkle setup".
# Tags containing a hyphen (v0.1.0-rc1) are published as pre-releases: never "latest", no website rebuild.
permissions:
  contents: write


jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Require website deploy hook for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "::error::VERCEL_DEPLOY_HOOK_URL is not set. Without it the website cannot learn about this release. Create a Deploy Hook on the macpeek-web Worker in Cloudflare (Settings > Builds > Deploy Hooks, branch main) and save its URL as that secret."; exit 1; }

      - name: Require Sparkle keys
        env:
          SPARKLE_PRIVATE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE" || { echo "::error::Secret SPARKLE_ED_PRIVATE_KEY is not set (see docs/release.md, Sparkle setup)."; exit 1; }
          test -n "$SPARKLE_PUBLIC" || { echo "::error::Repository variable SPARKLE_PUBLIC_ED_KEY is not set (see docs/release.md, Sparkle setup)."; exit 1; }

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign app (Developer ID, hardened runtime)
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SIGN_IDENTITY" || { echo "DEVELOPER_ID_IDENTITY missing — refusing to publish unsigned build"; exit 1; }
          scripts/build-app.sh "$VERSION"

      - name: Create DMG
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: scripts/make-dmg.sh "$VERSION"

      - name: Notarize and staple (fails the release if rejected)
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "dist/MacPeek-${VERSION}.dmg" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "dist/MacPeek-${VERSION}.dmg"
          xcrun stapler validate "dist/MacPeek-${VERSION}.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/MacPeek-${VERSION}.dmg"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Sign update and write appcast.xml (Sparkle)
        # Sign the final, stapled DMG, then describe it in the update feed the app reads
        # (releases/latest/download/appcast.xml always resolves to the newest stable release's feed).
        env:
          SPARKLE_PRIVATE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # sign_update ships inside the Sparkle package SwiftPM already downloaded and checksum-verified for the build
          # (the version pinned in Package.swift), so no separate, unverified download runs with the private key.
          SIGN_UPDATE="$(find .build/artifacts -type f -name sign_update | head -1)"
          test -x "$SIGN_UPDATE" || { echo "::error::sign_update not found in the SwiftPM Sparkle artifact"; exit 1; }
          DMG="dist/MacPeek-${VERSION}.dmg"
          SIG="$(printf '%s' "$SPARKLE_PRIVATE" | "$SIGN_UPDATE" --ed-key-file - -p "$DMG")"
          test -n "$SIG" || { echo "::error::sign_update produced no signature"; exit 1; }
          LENGTH="$(stat -f%z "$DMG")"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/MacPeek-${VERSION}.dmg"
          NOTES="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>MacPeek</title>
              <item>
                <title>MacPeek ${VERSION}</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>${NOTES}</sparkle:releaseNotesLink>
                <enclosure url="${URL}" length="${LENGTH}" type="application/octet-stream" sparkle:edSignature="${SIG}"/>
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout dist/appcast.xml
          cat dist/appcast.xml

      - name: Add versionless DMG and checksums
        # The website's Download button links to releases/latest/download/MacPeek.dmg, a name that never changes,
        # so it always serves the newest release without editing the site.
        run: |
          set -euo pipefail
          cd dist
          cp "MacPeek-${VERSION}.dmg" MacPeek.dmg
          shasum -a 256 "MacPeek-${VERSION}.dmg" MacPeek.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacPeek-${{ env.VERSION }}.dmg
            dist/MacPeek.dmg
            dist/SHA256SUMS
            dist/appcast.xml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Rebuild website (shows the new version)
        # Releases created with GITHUB_TOKEN do not trigger other workflows, so the hook is called here. The release is
        # already public at this point, so a failed call warns (with the manual fix) instead of failing the job.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if curl -fsS --connect-timeout 10 --max-time 60 -X POST "$HOOK" >/dev/null; then
            echo "Website rebuild triggered"
          else
            echo "::warning::Release published, but the website rebuild call failed. Trigger a rebuild of the macpeek-web Worker in Cloudflare (Settings > Builds, or POST the deploy hook) so the site shows v${VERSION}."
          fi
